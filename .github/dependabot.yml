# Weekly update PRs. Keeping yt-dlp current matters most: extractors break when
# SoundCloud or YouTube change, and fixes ship as new yt-dlp releases.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
