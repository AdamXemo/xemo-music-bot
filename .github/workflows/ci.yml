name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Throwaway database for tests/db; the migration round trip drops its tables.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: xemo
          POSTGRES_PASSWORD: xemo
          POSTGRES_DB: xemo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xemo -d xemo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Throwaway cache for tests/db; tests flush index 15, never the default 0.
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://xemo:xemo@localhost:5432/xemo_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag, so pin the exact release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Build only, no push: a broken Dockerfile should fail the PR, not the first deploy.
      - name: Build image
        run: docker build .
