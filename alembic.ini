[alembic]
# Relative to this file, so alembic works from any working directory (tests chdir away).
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os
# No sqlalchemy.url here: migrations/env.py reads DATABASE_URL through config.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
