[project]
name = "xemo-music-bot"
version = "0.0.1"
description = "A clean, private Telegram music bot for a group of friends."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adam Xemo" }]
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.15.0",
]

[project.scripts]
xemo-music-bot = "xemo_music_bot.__main__:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: modern syntax
    "SIM",     # simplify
    "C4",      # comprehensions
    "RUF",     # ruff-specific
    "D",       # pydocstyle (Google convention below)
    "T20",     # no print
    "S",       # bandit: security
    "ASYNC",   # async pitfalls
    "PTH",     # pathlib over os.path
    "RET",     # return statements
    "N",       # pep8 naming
]
ignore = [
    "D100",  # module docstrings are optional for small modules
    "D104",  # package docstrings are optional
    "D105",  # magic methods document themselves
    "D107",  # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point, docstrings would be noise.
"tests/**" = ["S101", "D"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
xfail_strict = true

[tool.coverage.run]
source = ["xemo_music_bot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
