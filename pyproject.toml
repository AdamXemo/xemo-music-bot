[project]
name = "xemo-music-bot"
version = "0.0.1"
description = "A clean, private Telegram music bot for a group of friends."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adam Xemo" }]
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.15.0",
]

[project.scripts]
xemo-music-bot = "xemo_music_bot.__main__:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
